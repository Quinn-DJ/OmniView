name: OmniView
options:
  bundleIdPrefix: com.quinn
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.2.0"
targets:
  OmniView:
    type: application
    platform: macOS
    sources:
      - path: OmniView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quinn.omniview
        PRODUCT_NAME: OmniView
        INFOPLIST_FILE: OmniView/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: ""
    entitlements:
      path: OmniView/OmniView.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
    scheme:
      testTargets:
        - OmniViewTests
        - OmniViewUITests
  OmniViewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OmniViewTests
    dependencies:
      - target: OmniView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quinn.omniview.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OmniView.app/Contents/MacOS/OmniView
        BUNDLE_LOADER: $(TEST_HOST)
  OmniViewUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: OmniViewUITests
    dependencies:
      - target: OmniView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quinn.omniview.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: OmniView
