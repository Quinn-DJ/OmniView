name: Release

# 触发方式：
#   1. 手动触发（Actions 页面点 Run workflow）：自动读取 project.yml 版本号，
#      创建 v<版本> 标签，随后自动构建 DMG 并发布 GitHub Release
#   2. 推送 v* 标签（如 git tag v0.2.0 && git push origin v0.2.0）：
#      直接构建 DMG 并发布
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep -E 'MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*: *"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本号: $VERSION"

      - name: 构建并打包 DMG（arm64）
        run: ./scripts/build_dmg.sh

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 推送标签触发时用标签名；手动触发时用 project.yml 中的版本号（自动创建标签）
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}
          files: build/OmniView-*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
